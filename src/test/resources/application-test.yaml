spring:
  datasource:
    url: jdbc:h2:mem:like;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  cloud:
    discovery:
      enabled: false
  kafka:
    listener:
      auto-startup: false
    admin:
      fail-fast: false
      auto-create: false
  data:
    redis:
      repositories:
        enabled: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

eureka:
  client:
    enabled: false

management:
  health:
    redis:
      enabled: false

app:
  gateway:
    auth-header-mapping-enabled: false

like:
  kafka:
    consumer-enabled: false
  outbox:
    enabled: false
