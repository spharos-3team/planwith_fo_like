# 로컬 개발용 설정 (IntelliJ bootRun / IDE).
# planwith-infra MySQL 호스트 포트: 3307
# application.yaml의 optional import로 병합된다. 환경 변수가 있으면 env가 우선한다.

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/like_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:like_user}
    password: ${DB_PASSWORD:like_pass}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${LIKE_KAFKA_CONSUMER_ENABLED:false}

server:
  port: ${SERVER_PORT:8091}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:false}
    serviceUrl:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

like:
  kafka:
    consumer-enabled: ${LIKE_KAFKA_CONSUMER_ENABLED:false}
  outbox:
    enabled: ${LIKE_OUTBOX_ENABLED:true}
