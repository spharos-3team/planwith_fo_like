spring:
  config:
    import: optional:classpath:application.local.yaml
  application:
    name: planwith-fo-like
  datasource:
    url: ${DB_URL:}
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:like-service}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record
      auto-startup: ${LIKE_KAFKA_CONSUMER_ENABLED:false}

server:
  address: ${SERVER_ADDRESS:0.0.0.0}
  port: ${SERVER_PORT:8091}

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    serviceUrl:
      defaultZone: "${EUREKA_DEFAULT_ZONE:http://discovery:8761/eureka/}"
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: /swagger-ui.html

app:
  gateway:
    public-url: ${GATEWAY_PUBLIC_URL:/}
    auth-header-mapping-enabled: ${GATEWAY_AUTH_HEADER_MAPPING_ENABLED:true}
  auth:
    id: ${LOGIN_ID:test-001}
    pw: ${LOGIN_PASSWORD:1234}
  deploy:
    marker: ${DEPLOY_MARKER:planwith-fo-like-deploy-v1}

like:
  kafka:
    consumer-enabled: ${LIKE_KAFKA_CONSUMER_ENABLED:false}
    topics:
      like-created: ${LIKE_TOPIC_CREATED:planwith.like.created}
      like-removed: ${LIKE_TOPIC_REMOVED:planwith.like.removed}
  outbox:
    enabled: ${LIKE_OUTBOX_ENABLED:true}
    relay-batch-size: ${LIKE_OUTBOX_RELAY_BATCH_SIZE:50}
    relay-interval: ${LIKE_OUTBOX_RELAY_INTERVAL:5s}
    relay-initial-delay: ${LIKE_OUTBOX_RELAY_INITIAL_DELAY:5s}
    send-timeout: ${LIKE_OUTBOX_SEND_TIMEOUT:10s}
    max-retry: ${LIKE_OUTBOX_MAX_RETRY:10}
    backoff-initial: ${LIKE_OUTBOX_BACKOFF_INITIAL:5s}
    backoff-multiplier: ${LIKE_OUTBOX_BACKOFF_MULTIPLIER:2}
    backoff-max: ${LIKE_OUTBOX_BACKOFF_MAX:5m}
  cache:
    key-prefix: ${LIKE_CACHE_KEY_PREFIX:like}
    ttl: ${LIKE_CACHE_TTL:10m}
    guard-ttl: ${LIKE_CACHE_GUARD_TTL:5s}
