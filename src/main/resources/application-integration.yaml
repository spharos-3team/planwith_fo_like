spring:
  config:
    activate:
      on-profile: integration
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3307/like_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:like_user}
    password: ${DB_PASSWORD:like_pass}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      auto-startup: ${LIKE_KAFKA_CONSUMER_ENABLED:false}

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8091}

eureka:
  client:
    enabled: true
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  gateway:
    public-url: /
    auth-header-mapping-enabled: true

like:
  kafka:
    consumer-enabled: ${LIKE_KAFKA_CONSUMER_ENABLED:false}
  outbox:
    enabled: ${LIKE_OUTBOX_ENABLED:false}
